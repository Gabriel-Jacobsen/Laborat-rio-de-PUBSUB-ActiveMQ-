services:
  activemq:
    image: apache/activemq-artemis:latest
    container_name: activemq-amqp
    ports:
      - "8161:8161"
      - "5672:5672"
    environment:
      ARTEMIS_USER: admin
      ARTEMIS_PASSWORD: admin
    volumes:
      - artemis-data:/var/lib/artemis-instance
    restart: unless-stopped

volumes:
  artemis-data: